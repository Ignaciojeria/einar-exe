services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    # Hot reload con air + logs a archivo y stdout
    command: sh -c "air -c .air.toml 2>&1 | tee -a /var/log/app/app.log"
    tty: true
    volumes:
      - .:/app
      - ./logs:/var/log/app
      - ./secrets/casdoor-jwt.pem:/run/secrets/casdoor-jwt.pem:ro
    depends_on:
      db:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    environment:
      # App (process-level)
      APP_ENV: ${APP_ENV}
      APP_PORT: ${APP_PORT}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROJECT_NAME: ${PROJECT_NAME:-einar-exe}
      VERSION: ${VERSION:-}
      # Backing service: Postgres
      DATABASE_URL: ${DATABASE_URL}
      CASDOOR_JWT_PUBLIC_KEY_FILE: /run/secrets/casdoor-jwt.pem
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  # Rota ./logs/app.log cada día y conserva 3 copias (≈3 días)
  logrotate:
    image: blacklabelops/logrotate
    container_name: einar-logrotate
    volumes:
      - ./logs:/var/log/app
    environment:
      LOGS_DIRECTORIES: /var/log/app
      LOGROTATE_INTERVAL: daily
      LOGROTATE_COPIES: 3
      LOGROTATE_COMPRESSION: compress
      LOGROTATE_SIZE: 50M
    restart: unless-stopped

  db:
    image: postgis/postgis:17-3.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  casdoor:
    # Imagen sin DB embebida (la all-in-one fuerza MariaDB local e ignora env vars).
    # Verifica el último tag estable en https://hub.docker.com/r/casbin/casdoor
    image: casbin/casdoor:v1.811.0
    container_name: einar-casdoor
    ports:
      - "${CASDOOR_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUNNING_IN_DOCKER: "true"
      # Backend storage (Postgres compartido, database lógica `casdoor`)
      driverName: ${CASDOOR_DRIVER}
      # Casdoor parsea dbname del propio dataSourceName: concatenamos al final.
      dataSourceName: "${CASDOOR_DATA_SOURCE}${CASDOOR_DB_NAME}"
      dbName: ${CASDOOR_DB_NAME}
      # HTTP
      httpport: "8000"
      origin: ${CASDOOR_ORIGIN}
      origin_frontend: ${CASDOOR_ORIGIN_FRONTEND}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Migraciones SQL (proceso one-off, factor XII).
  # Corre como `postgres` (superuser) para poder crear extensiones;
  # las tablas se crean bajo SET ROLE einar para owner correcto.
  # Uso:
  #   docker compose --profile tools run --rm migrate              # up (default)
  #   docker compose --profile tools run --rm migrate down 1
  #   docker compose --profile tools run --rm migrate version
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EINAR_DB_NAME}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  # ── Redash (dashboards & queries) ──────────────────────────
  redash-redis:
    image: redis:7-alpine
    volumes:
      - redash-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redash-server:
    image: redash/redash:25.8.0
    ports:
      - "${REDASH_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      PYTHONUNBUFFERED: "0"
    command: server
    restart: unless-stopped

  redash-worker:
    image: redash/redash:25.8.0
    depends_on:
      redash-server:
        condition: service_started
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      QUEUES: "queries,scheduled_queries,celery"
      WORKERS_COUNT: "2"
    command: worker
    restart: unless-stopped

  redash-scheduler:
    image: redash/redash:25.8.0
    depends_on:
      redash-server:
        condition: service_started
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    command: scheduler
    restart: unless-stopped

  # One-off: crea tablas de Redash en Postgres (idempotente)
  redash-init:
    image: redash/redash:25.8.0
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    command: create_db

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    ports:
      - "${ZO_PORT:-5080}:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
    volumes:
      - o2data:/data
    restart: unless-stopped

volumes:
  pgdata:
  o2data:
  redash-redis:
