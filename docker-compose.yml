services:
  # Reverse proxy = única puerta pública del stack.
  # exe.dev hace TLS termination ANTES de Caddy; aquí corre HTTP plano.
  # Por qué existe: exe.dev solo permite UN puerto público por VM, y
  # nuestro SaaS expone 4 servicios (app, casdoor, redash, openobserve)
  # que deben ser accesibles anónimamente. Caddy hace path-routing
  # interno para repartir ese único puerto.
  caddy:
    image: caddy:2-alpine
    container_name: einar-caddy
    ports:
      # exe.dev solo permite puertos 3000-9999 como públicos.
      # Aprovechamos que el VM ya está set-public en :8000 (default que
      # tenía Casdoor). Ahora Caddy responde ahí y enruta internamente.
      - "8000:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ./caddy/caddy.env
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    # Hot reload con air. Logs solo a stdout (12-factor XI):
    # docker los captura via `logging.driver: local` con rotación.
    # Tu orquestador / agregador de logs los recoge desde ahí.
    command: air -c .air.toml
    tty: true
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    # Sin environment block: el binario Go lee .env directamente via
    # godotenv (bind-mount en /app/.env). Esto evita doble-fuente y los
    # problemas de variables del shell pisando al .env.
    # Si en prod corres sin bind-mount, tú decides: pasas las vars por
    # `environment:` aquí o las inyectas vía secret manager.
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgis/postgis:17-3.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Migraciones SQL (proceso one-off, factor XII).
  # Corre como `postgres` (superuser) para poder crear extensiones;
  # las tablas se crean bajo SET ROLE einar para owner correcto.
  # Uso:
  #   docker compose --profile tools run --rm migrate              # up (default)
  #   docker compose --profile tools run --rm migrate down 1
  #   docker compose --profile tools run --rm migrate version
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EINAR_DB_NAME}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  # ── Metabase (BI: dashboards, queries, multi-tenant via groups) ──
  # Reemplazó a Redash en Fase 6: Metabase soporta CSP iframe-friendly,
  # SSO via JWT, y groups/collections para aislamiento por tenant.
  # Auto-bootstrap: setup.sh hace POST /api/setup en primer arranque
  # para crear el admin user con MB_BOOTSTRAP_* del .env.
  metabase:
    image: metabase/metabase:v0.50.27
    # Sin port mapping al host: solo accesible vía Caddy en /mb/*.
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${METABASE_DB_NAME}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      # URL pública (Metabase la usa para links absolutos en emails y
      # signed URLs de embedding).
      MB_SITE_URL: https://einar.exe.xyz/mb
      # Permitir iframes desde el shell (mismo origin).
      MB_EMBEDDING_APP_ORIGIN: "https://einar.exe.xyz https://einar.exe.xyz:* http://localhost:*"
      MB_ENABLE_EMBEDDING: "true"
      # Soporte explícito para path prefix vía X-Forwarded-Prefix.
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped


  # ── pgweb (Web UI para PostgreSQL) ──────────────────────────────
  # Accesible vía Caddy en /pgweb/*. Conecta al Postgres del stack
  # como superuser para inspección completa.
  pgweb:
    image: sosedoff/pgweb:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EINAR_DB_NAME}?sslmode=disable
    restart: unless-stopped

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    # Sin ports: solo accesible vía Caddy en /o2/* (ruta pública con
    # mismo dominio que la app, evita el wall de exe.dev en :5080).
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      # ZO_BASE_URI: prefijo público bajo el que sirve Caddy. OO genera
      # sus assets/links con este prefix → funcionan a través del strip
      # de Caddy (`handle_path /o2/*`). Sin esto, los assets se buscan
      # en /web/* y rompen al estar la app embebida en /o2/web/*.
      ZO_BASE_URI: /o2
      # Permitir embed en iframe del shell (mismo origen).
      ZO_COOKIE_SAME_SITE_LAX: "true"
    volumes:
      - o2data:/data
    restart: unless-stopped

volumes:
  pgdata:
  o2data:
  caddy_data:
  caddy_config:
