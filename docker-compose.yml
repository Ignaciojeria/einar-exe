services:
  # Reverse proxy = única puerta pública del stack.
  # exe.dev hace TLS termination ANTES de Caddy; aquí corre HTTP plano.
  # Por qué existe: exe.dev solo permite UN puerto público por VM, y
  # nuestro SaaS expone 4 servicios (app, casdoor, redash, openobserve)
  # que deben ser accesibles anónimamente. Caddy hace path-routing
  # interno para repartir ese único puerto.
  caddy:
    image: caddy:2-alpine
    container_name: einar-caddy
    ports:
      # exe.dev solo permite puertos 3000-9999 como públicos.
      # Aprovechamos que el VM ya está set-public en :8000 (default que
      # tenía Casdoor). Ahora Caddy responde ahí y enruta internamente.
      - "8000:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - casdoor
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    # Hot reload con air. Logs solo a stdout (12-factor XI):
    # docker los captura via `logging.driver: local` con rotación.
    # Tu orquestador / agregador de logs los recoge desde ahí.
    command: air -c .air.toml
    tty: true
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    # Sin environment block: el binario Go lee .env directamente via
    # godotenv (bind-mount en /app/.env). Esto evita doble-fuente y los
    # problemas de variables del shell pisando al .env.
    # Si en prod corres sin bind-mount, tú decides: pasas las vars por
    # `environment:` aquí o las inyectas vía secret manager.
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgis/postgis:17-3.5
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  casdoor:
    # Imagen sin DB embebida (la all-in-one fuerza MariaDB local e ignora env vars).
    # Verifica el último tag estable en https://hub.docker.com/r/casbin/casdoor
    image: casbin/casdoor:v1.811.0
    container_name: einar-casdoor
    # Sin port mapping al host: Casdoor solo es accesible vía Caddy o
    # via docker DNS desde otros contenedores (http://casdoor:8000).
    # Si necesitas debugear su UI directamente, usa Caddy:
    # https://einar.exe.xyz/login (Caddy lo pasa a casdoor:8000).
    depends_on:
      db:
        condition: service_healthy
    # init_data.json se renderiza en el host por scripts/setup.sh
    # (envsubst-like sobre casdoor/init_data.json.tpl) y se monta
    # read-only. Casdoor lo lee desde su WORKDIR (/) al arrancar y
    # crea cualquier objeto declarado que aún no exista en la DB.
    volumes:
      - ./casdoor/init_data.json:/init_data.json:ro
    environment:
      RUNNING_IN_DOCKER: "true"
      # Backend storage (Postgres compartido, database lógica `casdoor`)
      driverName: ${CASDOOR_DRIVER}
      # Casdoor parsea dbname del propio dataSourceName: concatenamos al final.
      dataSourceName: "${CASDOOR_DATA_SOURCE}${CASDOOR_DB_NAME}"
      dbName: ${CASDOOR_DB_NAME}
      # HTTP
      httpport: "8000"
      origin: ${CASDOOR_ORIGIN}
      origin_frontend: ${CASDOOR_ORIGIN_FRONTEND}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Migraciones SQL (proceso one-off, factor XII).
  # Corre como `postgres` (superuser) para poder crear extensiones;
  # las tablas se crean bajo SET ROLE einar para owner correcto.
  # Uso:
  #   docker compose --profile tools run --rm migrate              # up (default)
  #   docker compose --profile tools run --rm migrate down 1
  #   docker compose --profile tools run --rm migrate version
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${EINAR_DB_NAME}?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  # ── Redash (dashboards & queries) ──────────────────────────
  redash-redis:
    image: redis:7-alpine
    volumes:
      - redash-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redash-server:
    image: redash/redash:25.8.0
    ports:
      - "${REDASH_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      PYTHONUNBUFFERED: "0"
    command: server
    restart: unless-stopped

  redash-worker:
    image: redash/redash:25.8.0
    depends_on:
      redash-server:
        condition: service_started
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      QUEUES: "queries,scheduled_queries,celery"
      WORKERS_COUNT: "2"
    command: worker
    restart: unless-stopped

  redash-scheduler:
    image: redash/redash:25.8.0
    depends_on:
      redash-server:
        condition: service_started
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    command: scheduler
    restart: unless-stopped

  # One-off: crea tablas de Redash en Postgres (idempotente)
  redash-init:
    image: redash/redash:25.8.0
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
      redash-redis:
        condition: service_healthy
    environment:
      REDASH_DATABASE_URL: postgres://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@db:5432/${REDASH_DB_NAME}
      REDASH_REDIS_URL: redis://redash-redis:6379/0
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    command: create_db

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    # Sin ports: solo accesible vía Caddy en /o2/* (ruta pública con
    # mismo dominio que la app, evita el wall de exe.dev en :5080).
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD}
      # ZO_BASE_URI: prefijo público bajo el que sirve Caddy. OO genera
      # sus assets/links con este prefix → funcionan a través del strip
      # de Caddy (`handle_path /o2/*`). Sin esto, los assets se buscan
      # en /web/* y rompen al estar la app embebida en /o2/web/*.
      ZO_BASE_URI: /o2
      # Permitir embed en iframe del shell (mismo origen).
      ZO_COOKIE_SAME_SITE_LAX: "true"
    volumes:
      - o2data:/data
    restart: unless-stopped

volumes:
  pgdata:
  o2data:
  redash-redis:
  caddy_data:
  caddy_config:
